<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a2744" />
  <title>Song · MRJ Day 2 Words</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="songs.css?v=20261016-stages5" />
</head>
<body>
  <div class="player" id="player">
    <div class="slides" id="slides" aria-hidden="true">
      <div class="slide" data-layer="0"><div class="kb grad grad-0"><img alt="" /></div></div>
      <div class="slide" data-layer="1"><div class="kb grad grad-3"><img alt="" /></div></div>
    </div>
    <div class="shade"></div>

    <header class="topbar">
      <a class="icon-btn" id="btn-home" href="index.html">Songs</a>
      <h1 id="song-title">Song</h1>
      <button type="button" class="text-btn" id="btn-pause" hidden>Pause</button>
    </header>
    <div class="track" id="track" hidden><span id="track-bar"></span></div>

    <section class="ready" id="panel-ready">
      <h2 id="ready-title">Song</h2>
      <p class="sub" id="ready-sub"></p>
      <button type="button" class="mode listen" id="btn-listen">1. Listen<small>듣기 · the whole song</small></button>
      <button type="button" class="mode sing" id="btn-tap-stage">2. Tap<small>단어 누르기 · tap each word</small></button>
      <button type="button" class="mode practice" id="btn-practice">3. Practice<small>연습 · each line 3 times</small></button>
      <button type="button" class="mode quiz" id="btn-quiz">4. Mini Quiz<small>퀴즈 · 5 questions</small></button>
      <p class="best" id="ready-best" hidden></p>
    </section>

    <section class="dock" id="panel-play" hidden>
      <div class="practice-bar" id="practice-bar" hidden>
        <button type="button" class="big" id="btn-prev">Back</button>
        <p id="rep-label">1 / 3</p>
        <button type="button" class="big" id="btn-next" disabled>Next</button>
      </div>
      <p class="tap-hint" id="tap-hint" hidden>Tap each word!</p>
      <div class="band">
        <div class="line-now" id="line-now"></div>
        <div class="line-next" id="line-next"></div>
      </div>
    </section>

    <section class="ready quizp" id="panel-quiz" hidden>
      <p class="sub" id="quiz-count">1 / 5</p>
      <h2 id="quiz-prompt">What is this?</h2>
      <button type="button" class="big quiz-play" id="quiz-play" hidden>&#9654; Listen</button>
      <img class="quiz-pic" id="quiz-pic" alt="" hidden />
      <div class="quiz-choices" id="quiz-choices"></div>
    </section>

    <section class="score" id="panel-score" hidden>
      <p class="stars" id="score-stars" aria-label="stars">★★★</p>
      <p class="pct" id="score-pct">0%</p>
      <p class="msg" id="score-msg">Great job!</p>
      <p class="sub" id="score-detail"></p>
      <button type="button" class="mode sing" id="btn-again">Next</button>
      <button type="button" class="mode listen" id="btn-stages">Stages</button>
      <a class="mode practice" id="btn-songs" href="index.html" style="text-align:center;text-decoration:none;display:grid;place-items:center;">All songs</a>
    </section>

    <p class="err" id="err" hidden></p>
    <audio id="audio" playsinline webkit-playsinline preload="auto"></audio>
  </div>
  <link rel="stylesheet" href="https://mrjkorea.github.io/mrj-signin/mrj-auth.css">
  <script src="https://mrjkorea.github.io/mrj-signin/mrj-auth.js"></script>
  <script src="https://mrjkorea.github.io/mrj-signin/mrj-auth-boot.js" data-mrj-app="day2-words"></script>
  <script src="../mrj-scores.js?v=20261013-scores-receiver"></script>
  <script src="../js/progress-config.js?v=20261007-program-key"></script>
  <script src="../js/progress-merge.js?v=20261013-packpick"></script>
  <script src="../js/progress.js?v=20261013-scores-receiver"></script>
  <script>window.WM_BUILD_ID="20261013-scores-receiver";</script>
  <script src="../js/version-watch.js?v=20261013-scores-receiver"></script>
  <script src="play.js?v=20261020-pct"></script>
</body>
</html>
