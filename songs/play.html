<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a2744" />
  <title>Song · MRJ Day 2 Words</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="songs.css" />
</head>
<body>
  <div class="player" id="player">
    <div class="slides" id="slides" aria-hidden="true">
      <div class="slide" data-layer="0"><div class="kb grad grad-0"><img alt="" /></div></div>
      <div class="slide" data-layer="1"><div class="kb grad grad-3"><img alt="" /></div></div>
    </div>
    <div class="shade"></div>

    <header class="topbar">
      <a class="icon-btn" id="btn-home" href="index.html">Songs</a>
      <h1 id="song-title">Song</h1>
      <button type="button" class="text-btn" id="btn-pause" hidden>Pause</button>
    </header>
    <div class="track" id="track" hidden><span id="track-bar"></span></div>

    <section class="ready" id="panel-ready">
      <h2 id="ready-title">Song</h2>
      <p class="sub" id="ready-sub"></p>
      <button type="button" class="mode listen" id="btn-listen">Listen<small>듣기 · the whole song</small></button>
      <button type="button" class="mode practice" id="btn-practice">Practice<small>연습 · each line 3 times</small></button>
      <button type="button" class="mode sing" id="btn-sing">Sing and Tap<small>노래하고 누르기</small></button>
      <p class="best" id="ready-best" hidden></p>
    </section>

    <section class="dock" id="panel-play" hidden>
      <div class="practice-bar" id="practice-bar" hidden>
        <button type="button" class="big" id="btn-prev">Back</button>
        <p id="rep-label">1 / 3</p>
        <button type="button" class="big" id="btn-next">Next</button>
      </div>
      <button type="button" class="tap-btn" id="btn-tap" hidden>TAP</button>
      <div class="band">
        <div class="line-now" id="line-now"></div>
        <div class="line-next" id="line-next"></div>
      </div>
    </section>

    <section class="score" id="panel-score" hidden>
      <p class="stars" id="score-stars" aria-label="stars">★★★</p>
      <p class="pct" id="score-pct">0%</p>
      <p class="msg" id="score-msg">Great job!</p>
      <p class="sub" id="score-detail"></p>
      <button type="button" class="mode sing" id="btn-again">Sing again</button>
      <button type="button" class="mode listen" id="btn-listen-again">Listen</button>
      <a class="mode practice" id="btn-songs" href="index.html" style="text-align:center;text-decoration:none;display:grid;place-items:center;">All songs</a>
    </section>

    <p class="err" id="err" hidden></p>
    <audio id="audio" playsinline webkit-playsinline preload="auto"></audio>
  </div>
  <link rel="stylesheet" href="https://mrjkorea.github.io/mrj-signin/mrj-auth.css">
  <script src="https://mrjkorea.github.io/mrj-signin/mrj-auth.js"></script>
  <script src="https://mrjkorea.github.io/mrj-signin/mrj-auth-boot.js" data-mrj-app="day2-words"></script>
  <script src="../mrj-scores.js?v=20260928-onebook"></script>
  <script src="../js/progress-config.js?v=20261007-program-key"></script>
  <script src="../js/progress-merge.js?v=20261007-program-key"></script>
  <script src="../js/progress.js?v=20261007-program-key"></script>
  <script>window.WM_BUILD_ID="20261007-program-key";</script>
  <script src="../js/version-watch.js?v=20261007-program-key"></script>
  <script src="play.js"></script>
</body>
</html>
