<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRJ Day 2 Words · Word Master</title>
  <meta name="robots" content="noindex" />
  <script>
    /*
     * Thin redirect. Day 2 packs open in the one Word Master app:
     *   play.html?pack=<book>_u<unit>  ->  word-master/?packsrc=https://mrjkorea.github.io/day2-words/packs/<id>.json
     *   play.html (no pack)             ->  index.html (book / unit list)
     * Other query params and the #hash are kept.
     */
    (function () {
      var params = new URLSearchParams(location.search);
      var pack = params.get("pack") || "";
      var hash = location.hash || "";
      if (!/^[a-z0-9_]+$/.test(pack)) {
        location.replace("index.html" + hash);
        return;
      }
      params.delete("pack");
      var src = "https://mrjkorea.github.io/day2-words/packs/" + pack + ".json";
      var rest = params.toString();
      location.replace("https://mrjkorea.github.io/word-master/?packsrc=" + encodeURIComponent(src) + (rest ? "&" + rest : "") + hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=index.html" /></noscript>
</head>
<body>
  <p><a href="index.html">Day 2 Words</a></p>
</body>
</html>
