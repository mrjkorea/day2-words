<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation Review · Word Climb</title>
<link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="wb.css">
<style>body{font-family:system-ui,sans-serif;background:#eef7ff;margin:0;padding:16px;color:#123;max-width:900px}h1{margin:0 0 6px}p.lead{margin:0 0 16px;color:#456}h2{margin:22px 0 8px;font-size:18px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}a{display:block;background:#fff4e6;border-radius:14px;padding:14px;text-decoration:none;color:#123;box-shadow:0 2px 6px #0002}a b{color:#e8590c}.st{color:#e8a400}</style></head><body>
<h1>🏔️ Conversation Review Quizzes</h1>
<p class="lead">Merged word-climb packs (even mix from Basic A/B/C or Int 2A/2B/2C or Int 3A/3B/3C). Pass at 80%.</p>
<div id="L">Loading…</div>
<script>
const GROUPS=[
 {book:'basic_review',title:'Basic Review'},
 {book:'int2_review',title:'Intermediate 2 Review'},
 {book:'int3_review',title:'Intermediate 3 Review'}
];
fetch('data/units.json').then(r=>r.json()).then(U=>{
 const by={};U.forEach(u=>{if(u.book&&u.book.endsWith('_review'))(by[u.book]=by[u.book]||[]).push(u)});
 Object.values(by).forEach(arr=>arr.sort((a,b)=>a.n-b.n));
 L.innerHTML=GROUPS.filter(g=>by[g.book]).map(g=>`<h2>${g.title}</h2><div class="g">`+by[g.book].map(u=>{
  let p={};try{p=JSON.parse(localStorage.getItem('mrj_day3_'+u.id)||'{}')}catch(e){}
  return `<a href="climb.html?unit=${encodeURIComponent(u.id)}"><b>${u.label||'Review '+u.n}</b><br>${u.title.split('·').pop().trim()}${p.climb&&p.climb.pass?`<br><span class="st">⭐ ${p.climb.pct}%</span>`:''}</a>`}).join('')+'</div>').join('')||'<p>No review packs found.</p>';
});
</script>
<link rel="stylesheet" href="https://mrjkorea.github.io/mrj-signin/mrj-auth.css">
<link rel="stylesheet" href="../js/mrj-teacher-unlock.css?v=20261030-chip-teacher-only">
<script src="https://mrjkorea.github.io/mrj-signin/mrj-auth.js?v=20261030-cf-login-1.7.2-gas"></script>
<script src="https://mrjkorea.github.io/mrj-signin/mrj-auth-boot.js?v=20261030-cf-login-1.7.2-gas" data-mrj-app="day2-words"></script>
<script src="../js/mrj-teacher-unlock.js?v=20261030-chip-teacher-only"></script>
</body></html>
